<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <style>
        body { background: #1a1a24; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; color: white; font-family: sans-serif; overflow: hidden; }
        canvas { background: #4ec0ca; border: 4px solid #ff3366; border-radius: 8px; box-shadow: 0 0 20px rgba(255, 51, 102, 0.4); outline: none; cursor: pointer; }
        h1 { margin-bottom: 5px; font-size: 24px; color: #ff3366; font-weight: bold; margin-top: -20px;}
        p { color: #888; font-size: 13px; margin-bottom: 15px; text-align: center; }
        .highlight { color: #ff3366; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Flappy Clone</h1>
    <p>Clique ou use <span class="highlight">ESPAÇO</span> para voar (Gravidade ajustada)<br/>Aperte <span class="highlight">ESC</span> para sair e voltar ao feed</p>
    
    <canvas id="gameCanvas" width="320" height="480" tabindex="1"></canvas>
    
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        
        let frames = 0;
        let score = 0;
        let currentState = 0; // 0: Inicio, 1: Jogando, 2: Game Over
        
        const bird = {
            x: 50, y: 150, w: 20, h: 20,
            gravity: 0.25, // Gravidade reduzida para o passarinho ficar leve
            jump: 4.8,     // Força de impulso ajustada proporcionalmente
            speed: 0,
            draw() {
                ctx.fillStyle = "#f1c40f"; // Pássaro amarelo
                ctx.fillRect(this.x, this.y, this.w, this.h);
                ctx.strokeStyle = "#000";
                ctx.strokeRect(this.x, this.y, this.w, this.h);
            },
            flap() { this.speed = -this.jump; },
            update() {
                this.speed += this.gravity;
                this.y += this.speed;
                if(this.y + this.h >= canvas.height) { 
                    this.y = canvas.height - this.h; 
                    currentState = 2; // Bateu no chão = Game Over
                }
                if(this.y <= 0) this.y = 0; // Bateu no teto
            }
        };

        const pipes = {
            position: [], w: 40, gap: 140, dx: 2, // Gap um pouco maior para facilitar
            draw() {
                for(let i = 0; i < this.position.length; i++) {
                    let p = this.position[i];
                    ctx.fillStyle = "#2ecc71"; // Canos verdes
                    ctx.fillRect(p.x, 0, this.w, p.y); // Cano de cima
                    ctx.fillRect(p.x, p.y + this.gap, this.w, canvas.height - (p.y + this.gap)); // Cano de baixo
                }
            },
            update() {
                if(frames % 110 === 0) { // Espaçamento maior entre os canos
                    this.position.push({ x: canvas.width, y: Math.random() * (canvas.height - this.gap - 60) + 30 });
                }
                for(let i = 0; i < this.position.length; i++) {
                    let p = this.position[i];
                    p.x -= this.dx;
                    
                    // Remove canos que saíram da tela e marca ponto
                    if(p.x + this.w <= 0) { 
                        this.position.shift(); 
                        score++; 
                    }
                    
                    // Detecção de Colisão
                    if(bird.x + bird.w > p.x && bird.x < p.x + this.w && 
                      (bird.y < p.y || bird.y + bird.h > p.y + this.gap)) {
                        currentState = 2; // Game Over
                    }
                }
            }
        };

        function draw() {
            ctx.fillStyle = "#4ec0ca"; // Fundo azul
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            pipes.draw();
            bird.draw();
            
            ctx.fillStyle = "#fff";
            ctx.font = "35px sans-serif";
            ctx.fillText(score, canvas.width/2 - 10, 50);

            if(currentState === 0) {
                ctx.fillStyle = "rgba(0,0,0,0.4)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#fff";
                ctx.font = "20px sans-serif";
                ctx.fillText("Clique para Iniciar", 70, 240);
            }
            if(currentState === 2) {
                ctx.fillStyle = "rgba(0,0,0,0.5)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff3366";
                ctx.font = "30px sans-serif";
                ctx.fillText("Game Over", 85, 220);
                ctx.fillStyle = "#fff";
                ctx.font = "15px sans-serif";
                ctx.fillText("Clique para reiniciar", 95, 260);
            }
        }

        function update() {
            if(currentState === 1) {
                bird.update();
                pipes.update();
            }
            frames++;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function action(e) {
            if(e) {
                if([32, 37, 38, 39, 40].includes(e.keyCode)) {
                    e.preventDefault();
                }
                if(e.key === "Escape") {
                    window.parent.postMessage('releaseFocus', '*');
                    return;
                }
                if(e.type === "keydown" && e.keyCode !== 32) return;
            }
            
            if(currentState === 0) { currentState = 1; } 
            else if(currentState === 1) { bird.flap(); } 
            else if(currentState === 2) { 
                pipes.position = [];
                score = 0;
                bird.speed = 0;
                bird.y = 150;
                currentState = 0;
            }
        }

        canvas.addEventListener("click", () => { canvas.focus(); action(); });
        window.addEventListener("keydown", action);
        

        loop();
    </script>
</body>
</html>
