<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <style>
        body { background: #1a1a24; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; color: white; font-family: sans-serif; overflow: hidden; }
        canvas { background: #000; border: 4px solid #ff3366; border-radius: 8px; box-shadow: 0 0 20px rgba(255, 51, 102, 0.4); outline: none; }
        h1 { margin-bottom: 10px; font-size: 24px; color: #ff3399; font-weight: bold; margin-top: -30px;}
        p { color: #888; font-size: 14px; margin-bottom: 20px; text-align: center; }
        .highlight { color: #ff3366; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Snake 3000</h1>
    <p>Use as setas para jogar<br/>Aperte <span class="highlight">ESC</span> para sair do jogo e voltar a rolar o feed</p>
    
    <canvas id="gameCanvas" width="400" height="400" tabindex="1"></canvas>
    
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const box = 20;
        let snake = [{x: 9 * box, y: 10 * box}];
        let food = {
            x: Math.floor(Math.random() * 19 + 1) * box,
            y: Math.floor(Math.random() * 19 + 1) * box
        };
        let d;

        window.addEventListener("keydown", direction);
        function direction(event) {
            if([32, 37, 38, 39, 40].indexOf(event.keyCode) > -1) {
                event.preventDefault();
            }

            if(event.keyCode == 37 && d != "RIGHT") d = "LEFT";
            else if(event.keyCode == 38 && d != "DOWN") d = "UP";
            else if(event.keyCode == 39 && d != "LEFT") d = "RIGHT";
            else if(event.keyCode == 40 && d != "UP") d = "DOWN";
        }

        function draw() {
            ctx.fillStyle = "#121212";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for(let i = 0; i < snake.length; i++) {
                ctx.fillStyle = (i == 0) ? "#ff3366" : "#ffffff";
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
                ctx.strokeStyle = "#000";
                ctx.strokeRect(snake[i].x, snake[i].y, box, box);
            }

            ctx.fillStyle = "#00FF00";
            ctx.fillRect(food.x, food.y, box, box);

            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if(d == "LEFT") snakeX -= box;
            if(d == "UP") snakeY -= box;
            if(d == "RIGHT") snakeX += box;
            if(d == "DOWN") snakeY += box;

            if(snakeX == food.x && snakeY == food.y) {
                food = {
                    x: Math.floor(Math.random() * 19 + 1) * box,
                    y: Math.floor(Math.random() * 19 + 1) * box
                };
            } else {
                snake.pop();
            }

            let newHead = {x: snakeX, y: snakeY};

            if(snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) {
                clearInterval(game);
                ctx.fillStyle = "white";
                ctx.font = "30px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("Fim de Jogo!", canvas.width / 2, canvas.height / 2);
            }

            snake.unshift(newHead);
        }

        function collision(head, array) {
            for(let i = 0; i < array.length; i++) {
                if(head.x == array[i].x && head.y == array[i].y) return true;
            }
            return false;
        }

        let game = setInterval(draw, 100);
        
        canvas.addEventListener('click', function() {
            canvas.focus();
        });


        // 🚀 MÁGICA AQUI: Se apertar ESC, manda o Next.js pegar o foco de volta
        window.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
                window.parent.postMessage('releaseFocus', '*');
            }
        });
    </script>
</body>
</html>
